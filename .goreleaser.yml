# GoReleaser configuration for loom.
# Un solo binario estático por plataforma; checksums y firmas para GitHub
# Releases.
version: 2

project_name: loom

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: loom
    main: ./cmd/loom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  extra_files:
    - glob: ./scripts/install.sh
      name_template: "install.sh"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
